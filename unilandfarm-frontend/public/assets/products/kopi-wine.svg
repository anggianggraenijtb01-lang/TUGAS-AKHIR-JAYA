<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7eef0"/>
      <stop offset="55%" stop-color="#ead6dc"/>
      <stop offset="100%" stop-color="#d2b4be"/>
    </linearGradient>
    <linearGradient id="kraftBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e7852"/>
      <stop offset="30%" stop-color="#cfa980"/>
      <stop offset="65%" stop-color="#b88f65"/>
      <stop offset="100%" stop-color="#7d5c3b"/>
    </linearGradient>
    <linearGradient id="burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b1d2f"/>
      <stop offset="100%" stop-color="#3d0e19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="16" stdDeviation="14" flood-color="#291218" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="210" r="175" fill="#ffffff" opacity="0.55"/>

  <!-- Podium -->
  <g filter="url(#shadow)">
    <path d="M130,355 L470,355 L470,402 C470,416 394,426 300,426 C206,426 130,416 130,402 Z" fill="#4a202a"/>
    <ellipse cx="300" cy="355" rx="170" ry="18" fill="#6b303e"/>
  </g>

  <!-- Craft Paper Specialty Coffee Bag -->
  <g filter="url(#shadow)">
    <path d="M198,74 L402,74 L388,364 C388,374 352,380 300,380 C248,380 212,374 212,364 Z" fill="url(#kraftBag)"/>
    <rect x="198" y="74" width="204" height="12" rx="2" fill="#876442"/>
    <path d="M214,88 L224,362" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.18"/>
    <circle cx="300" cy="122" r="9" fill="#876442" stroke="#5e432a" stroke-width="1.5"/>

    <!-- Wine Process Burgundy Label -->
    <rect x="224" y="148" width="152" height="184" rx="4" fill="url(#burgundy)"/>
    <rect x="230" y="154" width="140" height="172" rx="2" fill="none" stroke="#ebd298" stroke-width="1"/>
    <rect x="256" y="166" width="88" height="16" rx="8" fill="#ebd298"/>
    <text x="300" y="177" text-anchor="middle" font-family="sans-serif" font-size="6.8" font-weight="bold" letter-spacing="1.2" fill="#3d0e19">WINE PROCESS</text>
    <text x="300" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#ffffff">ARABIKA SLAMET</text>
    <text x="300" y="222" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.4" fill="#ebd298">FERMENTASI ALAMI 30 HARI</text>
    <line x1="250" y1="234" x2="350" y2="234" stroke="#ebd298" stroke-width="0.8" opacity="0.5"/>
    <text x="300" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" font-style="italic" fill="#f9e6ec">Fruity Berry, Winey &amp; Sweet</text>
    <text x="300" y="308" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" letter-spacing="1.2" fill="#ebd298">LIMITED LOT • 200G</text>
  </g>
</svg>
