    <text x="300" y="338" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.2" fill="#8ce063">HIDROPONIK SEGAR</text>
    <text x="300" y="353" text-anchor="middle" font-family="sans-serif" font-size="6.5" letter-spacing="1" fill="#d9f5be">250 GRAM • CRISPY</text>
