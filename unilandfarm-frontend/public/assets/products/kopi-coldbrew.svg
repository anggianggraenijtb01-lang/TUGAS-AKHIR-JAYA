<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4efe8"/>
      <stop offset="60%" stop-color="#e2d5c4"/>
      <stop offset="100%" stop-color="#c9b49a"/>
    </linearGradient>
    <linearGradient id="coldBrewGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#170b05"/>
      <stop offset="28%" stop-color="#4d2410"/>
      <stop offset="52%" stop-color="#753919"/>
      <stop offset="80%" stop-color="#36180a"/>
      <stop offset="100%" stop-color="#140904"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#1f1209" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="215" r="170" fill="#ffffff" opacity="0.5"/>

  <!-- Podium -->
  <g filter="url(#shadow)">
    <path d="M140,358 L460,358 L460,404 C460,416 388,426 300,426 C212,426 140,416 140,404 Z" fill="#3b2618"/>
    <ellipse cx="300" cy="358" rx="160" ry="17" fill="#593a25"/>
  </g>

  <!-- Cold Brew Stubby Apothecary Bottle -->
  <g filter="url(#shadow)">
    <rect x="272" y="64" width="56" height="28" rx="4" fill="#d4af37"/>
    <rect x="276" y="92" width="48" height="28" fill="#2e1508"/>
    <path d="M222,172 C222,138 254,120 300,120 C346,120 378,138 378,172 L378,354 C378,366 350,374 300,374 C250,374 222,366 222,354 Z" fill="url(#coldBrewGlass)"/>
    <rect x="236" y="160" width="14" height="184" rx="7" fill="#f59e0b" opacity="0.28"/>

    <!-- Minimalist Cream Studio Label -->
    <rect x="236" y="192" width="128" height="136" rx="3" fill="#fcf9f2"/>
    <rect x="242" y="198" width="116" height="124" rx="2" fill="none" stroke="#3b2618" stroke-width="1"/>
    <text x="300" y="222" text-anchor="middle" font-family="sans-serif" font-size="6.8" font-weight="bold" letter-spacing="1.6" fill="#8c5327">18 HOURS STEEPED</text>
    <text x="300" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#1f1209">COLD BREW</text>
    <text x="300" y="260" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.4" fill="#593a25">KOPI SUSU GULA AREN</text>
    <line x1="258" y1="272" x2="342" y2="272" stroke="#d8cbb8" stroke-width="1"/>
    <text x="300" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-style="italic" fill="#594638">Smooth, Creamy &amp; Bold</text>
    <text x="300" y="312" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" letter-spacing="1.2" fill="#3b2618">SIAP MINUM • 250 ML</text>
  </g>
</svg>
