<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4efe6"/>
      <stop offset="60%" stop-color="#e4dac8"/>
      <stop offset="100%" stop-color="#cfc1a7"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451f06"/>
      <stop offset="25%" stop-color="#8f4711"/>
      <stop offset="50%" stop-color="#c46b1f"/>
      <stop offset="78%" stop-color="#78390b"/>
      <stop offset="100%" stop-color="#381804"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c692b"/>
      <stop offset="35%" stop-color="#efd79d"/>
      <stop offset="60%" stop-color="#c29a4d"/>
      <stop offset="100%" stop-color="#785820"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#291d12" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- Warm Sunbeam Rays -->
  <polygon points="0,0 260,0 120,450 0,450" fill="#ffffff" opacity="0.32"/>
  <polygon points="340,0 520,0 360,450 180,450" fill="#ffffff" opacity="0.24"/>

  <!-- Botanical Rosemary & Eucalyptus Leaves -->
  <g opacity="0.9">
    <path d="M185,335 C140,285 120,220 140,165 C180,185 200,255 185,335 Z" fill="#3b5b37"/>
    <path d="M215,345 C175,310 160,260 175,220 C205,235 220,285 215,345 Z" fill="#648555"/>
    <path d="M410,335 C455,285 475,220 455,165 C415,185 395,255 410,335 Z" fill="#4f7044"/>
  </g>

  <!-- Travertine Stone Base -->
  <g filter="url(#shadow)">
    <path d="M145,355 L455,355 L455,402 C455,415 385,425 300,425 C215,425 145,415 145,402 Z" fill="#dfd5c3"/>
    <ellipse cx="300" cy="355" rx="155" ry="17" fill="#f6f2e9"/>
  </g>

  <!-- Amber Apothecary Essential Oil Bottle -->
  <g filter="url(#shadow)">
    <!-- Ribbed Black Cap & Dropper -->
    <path d="M280,66 C280,44 320,44 320,66 L322,102 L278,102 Z" fill="#1a1817"/>
    <rect x="268" y="102" width="64" height="28" rx="4" fill="#282422"/>
    <rect x="268" y="126" width="64" height="8" fill="url(#goldBand)"/>
    <!-- Amber Bottle Body -->
    <path d="M238,172 C238,146 258,134 300,134 C342,134 362,146 362,172 L362,352 C362,364 342,372 300,372 C258,372 238,364 238,352 Z" fill="url(#amberGlass)"/>
    <!-- Amber Specular Highlights -->
    <rect x="250" y="160" width="12" height="186" rx="6" fill="#fde68a" opacity="0.38"/>
    <rect x="342" y="166" width="6" height="176" rx="3" fill="#f59e0b" opacity="0.35"/>

    <!-- Apothecary Label -->
    <rect x="246" y="194" width="108" height="138" rx="3" fill="#faf6ed"/>
    <rect x="251" y="199" width="98" height="128" rx="2" fill="none" stroke="#8c692b" stroke-width="0.9"/>
    <text x="300" y="222" text-anchor="middle" font-family="sans-serif" font-size="6.5" letter-spacing="1.8" fill="#7c7262">APOTHECARY GRADE</text>
    <text x="300" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="1.8" fill="#233726">GREENORA</text>
    <text x="300" y="257" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.4" fill="#9a5216">MINYAK ATSIRI</text>
    <line x1="268" y1="268" x2="332" y2="268" stroke="#d5cab6" stroke-width="1"/>
    <text x="300" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-style="italic" fill="#4f483d">Lavender &amp; Peppermint</text>
    <text x="300" y="312" text-anchor="middle" font-family="sans-serif" font-size="6.5" letter-spacing="1.2" fill="#857b6b">100% PURE • 30 ML</text>
  </g>
</svg>
