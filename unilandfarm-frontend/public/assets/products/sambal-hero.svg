<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3eb"/>
      <stop offset="55%" stop-color="#f5dcc8"/>
      <stop offset="100%" stop-color="#e3ba98"/>
    </linearGradient>
    <linearGradient id="chiliJar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e0d08"/>
      <stop offset="28%" stop-color="#b81d13"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="82%" stop-color="#8c140c"/>
      <stop offset="100%" stop-color="#470804"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c692b"/>
      <stop offset="35%" stop-color="#f5dea3"/>
      <stop offset="65%" stop-color="#c49b4b"/>
      <stop offset="100%" stop-color="#75561e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="16" stdDeviation="14" flood-color="#360c05" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="220" fill="#ffffff" opacity="0.6"/>

  <!-- Wooden Kitchen Podium -->
  <g filter="url(#shadow)">
    <path d="M130,415 L670,415 L670,480 C670,498 550,512 400,512 C250,512 130,498 130,480 Z" fill="#6e3f20"/>
    <ellipse cx="400" cy="415" rx="270" ry="26" fill="#8f552e"/>
  </g>

  <!-- Left Sambal Jar (Sambal Cakalang) -->
  <g filter="url(#shadow)" transform="translate(-135, 25) scale(0.88)">
    <rect x="315" y="135" width="170" height="34" rx="7" fill="#1f1a18"/>
    <path d="M298,195 C298,172 320,165 400,165 C480,165 502,172 502,195 L496,400 C496,418 462,428 400,428 C338,428 304,418 304,400 Z" fill="url(#chiliJar)"/>
    <rect x="316" y="185" width="14" height="210" rx="7" fill="#fca5a5" opacity="0.35"/>
    <rect x="318" y="230" width="164" height="135" rx="5" fill="#1f1614" stroke="url(#goldCap)" stroke-width="2"/>
    <text x="400" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.8" fill="#f5dea3">DAPUR BU ROES</text>
    <text x="400" y="292" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#f87171">SAMBAL CAKALANG</text>
    <text x="400" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#fde68a">Asap Khas Manado</text>
  </g>

  <!-- Right Sambal Jar (Sambal Bawang) -->
  <g filter="url(#shadow)" transform="translate(135, 25) scale(0.88)">
    <rect x="315" y="135" width="170" height="34" rx="7" fill="#1f1a18"/>
    <path d="M298,195 C298,172 320,165 400,165 C480,165 502,172 502,195 L496,400 C496,418 462,428 400,428 C338,428 304,418 304,400 Z" fill="url(#chiliJar)"/>
    <rect x="318" y="230" width="164" height="135" rx="5" fill="#1f1614" stroke="url(#goldCap)" stroke-width="2"/>
    <text x="400" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.8" fill="#f5dea3">DAPUR BU ROES</text>
    <text x="400" y="292" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#fbbf24">SAMBAL BAWANG</text>
    <text x="400" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#fde68a">Pedas Gurih Nagih</text>
  </g>

  <!-- Center Hero Sambal Jar (Sambal Cumi Asin) -->
  <g filter="url(#shadow)">
    <rect x="310" y="115" width="180" height="38" rx="8" fill="url(#goldCap)"/>
    <path d="M292,182 C292,156 318,148 400,148 C482,148 508,156 508,182 L502,412 C502,430 464,440 400,440 C336,440 298,430 298,412 Z" fill="url(#chiliJar)"/>
    <!-- Chili Seeds & Oil Texture Highlights -->
    <circle cx="345" cy="195" r="4" fill="#fbbf24" opacity="0.65"/>
    <circle cx="445" cy="205" r="4.5" fill="#fbbf24" opacity="0.65"/>
    <circle cx="375" cy="395" r="4" fill="#fbbf24" opacity="0.65"/>
    <circle cx="435" cy="388" r="4.5" fill="#fbbf24" opacity="0.65"/>
    <rect x="312" y="172" width="16" height="232" rx="8" fill="#ffffff" opacity="0.38"/>

    <!-- Center Gold-Bordered Label -->
    <rect x="312" y="218" width="176" height="154" rx="6" fill="#fbf7f0" stroke="url(#goldCap)" stroke-width="2.5"/>
    <rect x="352" y="232" width="96" height="18" rx="9" fill="#991b1b"/>
    <text x="400" y="244" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" letter-spacing="1.2" fill="#ffffff">BEST SELLER</text>
    <text x="400" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="1.8" fill="#1f120e">DAPUR BU ROES</text>
    <text x="400" y="294" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" letter-spacing="1.4" fill="#b91c1c">SAMBAL CUMI ASIN</text>
    <line x1="340" y1="306" x2="460" y2="306" stroke="#d6c7b2" stroke-width="1"/>
    <text x="400" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#574337">Resep Warisan Ibu • Fresh</text>
    <text x="400" y="352" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" letter-spacing="1.2" fill="#7c2d12">HALAL MUI • 200 GRAM</text>
  </g>
