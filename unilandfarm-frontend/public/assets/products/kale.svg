      <stop offset="0%" stop-color="#ebf4e8"/>
      <stop offset="100%" stop-color="#bdd6b3"/>
    </linearGradient>
    <linearGradient id="kaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6e28"/>
      <stop offset="60%" stop-color="#1c4a18"/>
      <stop offset="100%" stop-color="#0f2e0d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="14" stdDeviation="12" flood-color="#0f260d" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="220" r="165" fill="#ffffff" opacity="0.6"/>
  <g filter="url(#shadow)">
