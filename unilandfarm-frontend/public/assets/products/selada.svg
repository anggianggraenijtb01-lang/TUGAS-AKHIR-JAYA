    <path d="M240,340 C175,255 190,120 255,105 C305,115 315,235 285,340 Z" fill="#2f8520"/>
    <path d="M360,340 C425,255 410,120 345,105 C295,115 285,235 315,340 Z" fill="#3a9928"/>
