    <path d="M300,340 L300,120 M300,190 L272,155 M300,225 L330,185 M300,265 L275,235" stroke="#e5fad1" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Eco Kraft Sleeve Wrap -->
    <path d="M225,275 L375,275 L355,380 C355,390 330,396 300,396 C270,396 245,390 245,380 Z" fill="#d4b083"/>
    <rect x="242" y="295" width="116" height="68" rx="6" fill="#1b3b1e"/>
