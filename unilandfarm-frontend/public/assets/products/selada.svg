      <stop offset="100%" stop-color="#cce5c1"/>
    </linearGradient>
    <linearGradient id="romaine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cc48"/>
      <stop offset="60%" stop-color="#45a82e"/>
      <stop offset="100%" stop-color="#236b19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="14" stdDeviation="12" flood-color="#173612" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="220" r="165" fill="#ffffff" opacity="0.65"/>
