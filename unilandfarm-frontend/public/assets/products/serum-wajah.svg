<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3efe6"/>
      <stop offset="60%" stop-color="#e5decb"/>
      <stop offset="100%" stop-color="#d2c7af"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#142b1d"/>
      <stop offset="28%" stop-color="#2c593c"/>
      <stop offset="52%" stop-color="#3f7853"/>
      <stop offset="82%" stop-color="#1e3f2a"/>
      <stop offset="100%" stop-color="#0f2116"/>
    </linearGradient>
    <linearGradient id="goldCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d6b2e"/>
      <stop offset="30%" stop-color="#ebd298"/>
      <stop offset="55%" stop-color="#c39d52"/>
      <stop offset="80%" stop-color="#f5e2b5"/>
      <stop offset="100%" stop-color="#7d5d24"/>
    </linearGradient>
    <linearGradient id="podium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3dccd"/>
      <stop offset="45%" stop-color="#f8f5ee"/>
      <stop offset="100%" stop-color="#c7bca6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#1d241b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#glow)"/>

  <!-- Soft Window Shadow Stripes -->
  <path d="M0,0 L220,0 L80,450 L0,450 Z" fill="#ffffff" opacity="0.28"/>
  <path d="M310,0 L470,0 L320,450 L160,450 Z" fill="#ffffff" opacity="0.22"/>

  <!-- Botanical Leaves Behind Podium -->
  <g opacity="0.9">
    <path d="M195,330 C145,285 125,215 145,165 C185,185 205,255 195,330 Z" fill="#3a5a35"/>
    <path d="M405,330 C455,280 475,215 450,165 C410,185 395,255 405,330 Z" fill="#587b4c"/>
    <path d="M420,350 C475,335 505,295 495,255 C455,265 430,305 420,350 Z" fill="#2b4527"/>
  </g>

  <!-- Stone Podium -->
  <g filter="url(#shadow)">
    <path d="M150,355 L450,355 L450,405 C450,418 382,428 300,428 C218,428 150,418 150,405 Z" fill="url(#podium)"/>
    <ellipse cx="300" cy="355" rx="150" ry="18" fill="#f7f4ec"/>
  </g>

  <!-- Serum Dropper Bottle -->
  <g filter="url(#shadow)">
    <!-- Black Rubber Pipette Bulb -->
    <path d="M278,68 C278,42 322,42 322,68 L325,108 L275,108 Z" fill="#1e221f"/>
    <path d="M286,58 C286,48 300,48 300,58 L300,98 L286,98 Z" fill="#ffffff" opacity="0.14"/>
    <!-- Metallic Gold Collar -->
    <rect x="266" y="106" width="68" height="32" rx="4" fill="url(#goldCollar)"/>
    <line x1="266" y1="116" x2="334" y2="116" stroke="#7d5d24" stroke-width="1" opacity="0.5"/>
    <!-- Bottle Shoulder & Body -->
    <path d="M236,174 C236,148 256,138 300,138 C344,138 364,148 364,174 L364,352 C364,364 344,372 300,372 C256,372 236,364 236,352 Z" fill="url(#emeraldGlass)"/>
    <!-- Glass Highlight & Rim -->
    <rect x="248" y="162" width="12" height="186" rx="6" fill="#ffffff" opacity="0.32"/>
    <rect x="344" y="168" width="5" height="176" rx="2.5" fill="#95c5a3" opacity="0.25"/>
    <!-- Front Cream & Gold Label -->
    <rect x="246" y="196" width="108" height="136" rx="4" fill="#fbf9f3"/>
    <rect x="251" y="201" width="98" height="126" rx="2" fill="none" stroke="#c39d52" stroke-width="1"/>
    <circle cx="300" cy="224" r="10" fill="#233726"/>
    <path d="M296,227 C296,219 304,218 305,222 C305,226 300,229 296,227 Z" fill="#ebd298"/>
    <text x="300" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#1c3020">GREENORA</text>
    <text x="300" y="263" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.5" fill="#6E8854">BOTANICAL SERUM</text>
    <line x1="270" y1="274" x2="330" y2="274" stroke="#dcd2be" stroke-width="1"/>
    <text x="300" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-style="italic" fill="#5a5346">Centella &amp; Green Tea</text>
    <text x="300" y="314" text-anchor="middle" font-family="sans-serif" font-size="6.8" letter-spacing="1.2" fill="#877f70">BPOM RI • 30 ML</text>
  </g>

  <!-- Golden Serum Droplet Accent -->
  <path d="M392,295 C392,295 404,312 404,320 A12,12 0 1,1 380,320 C380,312 392,295 392,295 Z" fill="url(#goldCollar)" opacity="0.9"/>
</svg>
