<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ea"/>
      <stop offset="55%" stop-color="#d8ead0"/>
      <stop offset="100%" stop-color="#bbd8b0"/>
    </linearGradient>
    <linearGradient id="crateWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c49a6c"/>
      <stop offset="50%" stop-color="#dfba8e"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
    <linearGradient id="leafBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76c043"/>
      <stop offset="60%" stop-color="#3fa32c"/>
      <stop offset="100%" stop-color="#256b1b"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e8e2e"/>
      <stop offset="100%" stop-color="#194d14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#142e11" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="230" fill="#ffffff" opacity="0.6"/>

  <!-- Greenhouse Arch Lines -->
  <path d="M160,540 L160,190 A240,240 0 0,1 640,190 L640,540" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  <path d="M210,540 L210,210 A190,190 0 0,1 590,210 L590,540" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- Lush Hydroponic Greens Overflowing from Crate -->
  <g filter="url(#shadow)">
    <!-- Back Kale & Romaine Leaves -->
    <path d="M250,310 C190,230 205,135 265,125 C315,135 330,225 295,310 Z" fill="url(#leafDark)"/>
    <path d="M540,310 C600,230 585,135 525,125 C475,135 460,225 495,310 Z" fill="url(#leafDark)"/>
    <path d="M340,295 C305,195 345,105 405,105 C465,105 495,195 455,295 Z" fill="url(#leafBright)"/>
    <!-- Mid Pakcoy & Butterhead Leaves -->
    <path d="M215,345 C165,285 170,205 225,195 C275,205 290,275 265,345 Z" fill="url(#leafBright)"/>
    <path d="M585,345 C635,285 630,205 575,195 C525,205 510,275 535,345 Z" fill="url(#leafBright)"/>
    <circle cx="330" cy="255" r="68" fill="#5eb838"/>
    <circle cx="470" cy="255" r="68" fill="#4ca62b"/>
    <circle cx="400" cy="235" r="76" fill="url(#leafBright)"/>
    <!-- Crisp Leaf Veins -->
    <path d="M400,295 L400,180 M400,235 L370,205 M400,255 L435,220" stroke="#d9f5be" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M330,300 L315,215 M322,255 L295,235" stroke="#d9f5be" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M470,300 L485,215 M478,255 L505,235" stroke="#d9f5be" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

    <!-- Wooden Harvest Crate -->
    <rect x="200" y="290" width="400" height="165" rx="12" fill="url(#crateWood)"/>
    <rect x="215" y="308" width="370" height="36" rx="4" fill="#f7e6cf" opacity="0.35"/>
    <rect x="215" y="356" width="370" height="36" rx="4" fill="#f7e6cf" opacity="0.35"/>
    <rect x="215" y="404" width="370" height="34" rx="4" fill="#f7e6cf" opacity="0.35"/>
    <!-- Brand Badge on Crate -->
    <rect x="295" y="324" width="210" height="96" rx="8" fill="#1b3b1e" stroke="#a7c48c" stroke-width="2"/>
    <text x="400" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#ffffff">HIJAU HYDRO</text>
    <text x="400" y="378" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#8ce063">100% BEBAS PESTISIDA</text>
    <text x="400" y="402" text-anchor="middle" font-family="sans-serif" font-size="8" letter-spacing="1.2" fill="#d9f5be">PANEN SEGAR SETIAP PAGI</text>
  </g>
</svg>
